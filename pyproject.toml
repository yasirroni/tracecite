[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecite"
version = "0.0.1"
description = "Source-linked table normalisation and evidence retrieval for executable documentation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ARPST-UniMelb"}]
dependencies = [
  "beautifulsoup4>=4.12",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "tabulate>=0.9",
  "nbformat>=5.10",
  "nbclient>=0.11",
  "ipykernel>=7.3",
]

[project.optional-dependencies]
evidence = [
  "huggingface-hub>=1.23,<2",
  "pymupdf>=1.28,<2",
  "sentence-transformers>=5.6,<6",
  "sqlite-vec>=0.1.9,<0.2",
]
test = ["build>=1.2", "pytest>=8.4,<9"]

[project.scripts]
tracecite = "tracecite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracecite = ["skills/**/*"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"

[tool.ruff]
# scripts/bootstrap_docs.py copies docs_quarto_py from docs/. Markdown is not formatted
# because retained .html.md pages are generated output and skill fixtures are test data.
extend-exclude = ["docs_quarto_py", "*.md"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a notebook cell displays its value.
"docs/examples/python/*.py" = ["B018"]
