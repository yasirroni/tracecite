[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecite"
version = "0.4.0"
description = "Source-linked table normalisation for executable documentation and retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ARPST-UniMelb"}]
dependencies = [
  "beautifulsoup4>=4.12",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "tabulate>=0.9",
  "nbformat>=5.10",
  "nbclient==0.11.0",
]

[project.optional-dependencies]
test = ["build>=1.2"]

[project.scripts]
tracecite = "tracecite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
