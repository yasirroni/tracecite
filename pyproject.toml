[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecite"
version = "0.0.3"
description = "Source-linked table normalisation and evidence retrieval for executable documentation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ARPST-UniMelb"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
  "tabulate>=0.9",
]

[project.urls]
Homepage = "https://github.com/yasirroni/tracecite"
Documentation = "https://yasirroni.github.io/tracecite/"
Issues = "https://github.com/yasirroni/tracecite/issues"

[project.optional-dependencies]
# Quarto runs Python documentation pages through a Jupyter kernel.
docs = ["ipykernel>=7.3", "nbclient>=0.11", "nbformat>=5.10", "tracecite[pandas]"]
evidence = [
  "huggingface-hub>=1.23,<2",
  "pymupdf>=1.28,<2",
  "sentence-transformers>=5.6,<6",
  "sqlite-vec>=0.1.9,<0.2",
]
# knowledge_table and computed_first_row_summary take a pandas DataFrame.
pandas = ["pandas>=2.0"]
test = ["build>=1.2", "pytest>=8.4,<9", "tracecite[pandas]"]

[project.scripts]
tracecite = "tracecite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracecite = ["skills/**/*"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.ruff]
# scripts/bootstrap_docs.py copies docs_quarto_py from docs/. Markdown is not formatted
# because retained .html.md pages are generated output and skill fixtures are test data.
extend-exclude = ["docs_quarto_py", "*.md"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a notebook cell displays its value.
"docs/examples/python/*.py" = ["B018"]
