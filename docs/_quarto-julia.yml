project:
  render:
    - "!examples/python/*.py"
    - "!guide/repository_layout.py"
    - index.md
    - guide/*.md
    - "!guide/*.html.md"
    - formats/*.md
    - "!formats/*.html.md"
    - examples/julia/*.jl
    - examples/literate_documenter/index.md

# Quarto requires project-wide engine prioritisation for percent-format .jl pages.
engines:
  - julia

website:
  sidebar:
    style: docked
    contents:
