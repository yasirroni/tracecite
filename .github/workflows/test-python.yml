name: Test Python

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check lint and formatting
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-eng

      - name: Install dependencies
        run: uv sync --locked --extra evidence --extra test

      - name: Run Python tests
        run: uv run --no-sync pytest -q
