name: Test documentation variants

on:
  push:
    paths:
      - docs/**
      - docs_quarto_py/**
      - docs_quarto_jl/**
      - docs_jl/**
      - scripts/bootstrap_docs.py
      - docs/bootstrap.toml
      - .github/workflows/test-docs-variants.yml
  pull_request:
    paths:
      - docs/**
      - docs_quarto_py/**
      - docs_quarto_jl/**
      - docs_jl/**
      - scripts/bootstrap_docs.py
      - docs/bootstrap.toml
      - .github/workflows/test-docs-variants.yml
  workflow_dispatch:

jobs:
  bootstrap-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - name: Cache Julia packages
        uses: julia-actions/cache@v3

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          uv sync --locked
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
          julia --project=docs_jl -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Check bootstrap consistency
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/bootstrap_docs.py --check

      - name: Build documentation projects
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf docs/build docs_quarto_py/build docs_quarto_jl/build docs_jl/build
          uv run tracecite docs build docs
          uv run tracecite docs build docs_quarto_py --only python | tee /tmp/docs-quarto-py.log
          uv run tracecite docs build docs_quarto_jl --only julia | tee /tmp/docs-quarto-jl.log
          julia --project=docs_jl docs_jl/make.jl 2>&1 | tee /tmp/docs-jl.log

      - name: Verify build artifacts
        shell: bash
        run: |
          set -euxo pipefail
          test -f docs/build/index.html
          test -f docs_quarto_py/build/index.html
          test -f docs_quarto_jl/build/index.html
          test -f docs_jl/build/index.html
          grep -Eq 'Retained Markdown pages: [1-9][0-9]*' /tmp/docs-quarto-py.log
          grep -Eq 'Retained Markdown pages: [1-9][0-9]*' /tmp/docs-quarto-jl.log
          test -f docs_quarto_py/examples/python/dirty_dataframe.html.md
          test -f docs_quarto_jl/examples/julia/dirty_dataframe.html.md
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          pages = list(Path("docs_jl/build").rglob("*dirty_dataframe*.html"))
          if not pages:
              pages = list((Path("docs_jl/build") / "dirty_dataframe").rglob("*.html"))
          assert pages, "Documenter tutorial page was not generated"
          rendered = "\n".join(
              BeautifulSoup(path.read_text(encoding="utf-8"), "html.parser").get_text(
                  " ", strip=True
              )
              for path in pages
          )
          assert 'title: "TraceCite with Julia"' not in rendered
          assert "Capital cost ($/kW)" in rendered
          assert "Battery | BESS" in rendered

          pandoc_pages = list(
              (Path("docs_jl/build") / "formats" / "pandoc-tables").rglob("*.html")
          )
          if not pandoc_pages:
              pandoc_pages = [Path("docs_jl/build/formats/pandoc-tables.html")]
          assert all(path.is_file() for path in pandoc_pages)
          pandoc_rendered = "\n".join(
              BeautifulSoup(path.read_text(encoding="utf-8"), "html.parser").get_text(
                  " ", strip=True
              )
              for path in pandoc_pages
          )
          assert 'title: "Pandoc Markdown tables"' not in pandoc_rendered
          assert "Cost ($/kW)" in pandoc_rendered

          searchable = "\n".join(
              path.read_text(encoding="utf-8")
              for suffix in ("*.html", "*.js", "*.json")
              for path in Path("docs_jl/build").rglob(suffix)
          )
          assert "TRACECITELITERALDOLLAR7F3A9C" not in searchable
          PY
          python scripts/bootstrap_docs.py --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
